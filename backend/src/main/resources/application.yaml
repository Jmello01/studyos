spring:
  application:
    name: studyos
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:studyos}
    username: ${DB_USER:studyos}
    password: ${DB_PASSWORD:studyos_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
